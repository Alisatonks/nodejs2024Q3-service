services:
  nestapp:
    container_name: nestapp
    env_file: .env
    build: . 
    image: homelibrary/nestapp:1.0.0
    init: true
    ports:
      - "${PORT}:${PORT}"
    environment:
      TYPE: "${TYPE}"
      POSTGRESS_HOST: db
      POSTGRESS_USER: "${POSTGRESS_USER}"
      POSTGRESS_PASSWORD: "${POSTGRESS_PASSWORD}"
      POSTGRESS_DATABASE: "${POSTGRESS_DATABASE}"
      POSTGRESS_PORT: "${POSTGRESS_PORT}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - my-bridge-network
    restart: always
    volumes:
      - .:/usr/src/app 
    command: npm run start:dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/user"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
          ignore:
            - node_modules       
  db:
    container_name: db
    image: postgres:13
    environment:
      POSTGRES_USER: "${POSTGRESS_USER}"
      POSTGRES_PASSWORD: "${POSTGRESS_PASSWORD}"
      POSTGRES_DB: "${POSTGRESS_DATABASE}"
    ports:
      - "${POSTGRESS_PORT}:${POSTGRESS_PORT}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - my-bridge-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata: {}

networks:
  my-bridge-network:
    driver: bridge
    name: home-library-network
